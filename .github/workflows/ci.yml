name: ci
on:
  pull_request:
    branches: [ sandbox ]
  push:
    branches: [ sandbox ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (20.x) + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Enable corepack / prepare pnpm@9
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      # Устанавливаем зависимости, если есть lockfile; если проекта пока нет — просто пропускаем
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package.json ]; then
            pnpm install --no-frozen-lockfile
          else
            echo "No package.json yet — skipping install"
          fi

      # Если в package.json есть скрипт verify — запустим его, иначе лёгкий smoke
      - name: Verify or smoke
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.verify?0:1)"; then
            pnpm run verify
          else
            node -v && pnpm -v && echo "No verify script — smoke OK"
          fi
